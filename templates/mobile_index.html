<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Geboorteplan Assistent</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='mobile_style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

<div id="mobile-layout">
    <main id="main-content">

        <div id="stappenplan-view" class="view active">
            <div id="progress-bar-container"><div id="progress-bar"></div></div>

            <div id="themes-list-view" class="step-view active"></div>
            <div id="questions-list-view" class="step-view"></div>
            <div id="answer-options-view" class="step-view split-screen"></div>
        </div>

        <div id="chat-view" class="view">
            <div id="full-chatbox"></div>
        </div>

        <div id="summary-view" class="view"></div>
    </main>

    <div id="mobile-input-area" style="display: none;">
        <textarea id="mobile-input" placeholder="Typ een bericht..." rows="1"></textarea>
        <button id="mobile-send-btn" disabled><i class="fa-solid fa-paper-plane"></i></button>
    </div>

    <nav id="tab-bar">
        <div class="tab-item active" data-view="stappenplan-view"><i class="fa-solid fa-list-check"></i><span>Stappenplan</span></div>
        <div class="tab-item" data-view="chat-view"><i class="fa-solid fa-comments"></i><span>Chat</span></div>
        <div class="tab-item" data-view="summary-view"><i class="fa-solid fa-clipboard-check"></i><span>Antwoorden</span></div>
    </nav>
</div>

<template id="themes-list-template">
    </template>
<template id="questions-list-template">
    <div class="page-header" id="back-to-themes">
        <i class="fa-solid fa-arrow-left"></i>
        <h2 id="questions-theme-title"></h2>
    </div>
    <div id="questions-list-container"></div>
</template>
<template id="answer-options-template">
    <div id="options-panel">
        <div id="answer-breadcrumb"></div>
        <h3 class="question-title-header" id="answer-question-title"></h3>
        <div id="answer-buttons-container"></div>
        <div class="answer-actions">
            <div class="action-button" id="more-info-btn"><i class="fa-solid fa-circle-question"></i> Meer informatie</div>
            <div class="action-button" id="skip-question-btn"><i class="fa-solid fa-forward"></i> Sla vraag over</div>
        </div>
    </div>
    <div id="chat-context-panel">
        <div class="chatbox-context" id="answer-chat-context"></div>
    </div>
</template>
<template id="summary-template">
    <h2>Mijn Antwoorden</h2>
    <div id="summary-list-container"></div>
</template>

<script>
document.addEventListener('DOMContentLoaded', function() {

    // --- STATE MANAGEMENT ---
    let state = {
        plan: [],
        history: [],
        currentViewId: 'stappenplan-view',
        currentStepId: 'themes-list-view',
        selectedThemeId: null,
        selectedTopicId: null,
        isLocked: false,
        pendingAnswer: null
    };

    // --- ELEMENT SELECTORS ---
    const inputArea = document.getElementById('mobile-input-area');
    const input = document.getElementById('mobile-input');
    const sendBtn = document.getElementById('mobile-send-btn');
    const progressBar = document.getElementById('progress-bar');

    const API_URL = "/agent";

    // --- INITIALISATIE ---
    async function initialize() {
        setUiLock(true);
        const initialState = await callApi("initialize");
        if (initialState) {
            state.plan = initialState.state.plan;
            state.history = initialState.state.history || [];
            if (initialState.welcome_message) {
                addChatMessage('bot', initialState.welcome_message, 'full-chatbox');
            }
            renderCurrentView();
        }
        setUiLock(false);
    }

    // --- UI LOCK & INPUT HANDLING ---
    function setUiLock(locked) {
        state.isLocked = locked;
        input.disabled = locked;
        sendBtn.disabled = locked || input.value.trim() === '';
    }

    input.addEventListener('input', () => {
        sendBtn.disabled = state.isLocked || input.value.trim() === '';
        input.style.height = 'auto';
        input.style.height = (input.scrollHeight) + 'px';
    });
    sendBtn.addEventListener('click', handleSend);
    input.addEventListener('keydown', e => {
        if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault();
            handleSend();
        }
    });

    // --- CORE NAVIGATION & RENDERING ---
    function navigateToView(viewId) {
        if (state.currentViewId === viewId && viewId !== 'stappenplan-view') return;
        state.currentViewId = viewId;

        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById(viewId).classList.add('active');

        document.querySelector('.tab-item.active').classList.remove('active');
        document.querySelector(`.tab-item[data-view="${viewId}"]`).classList.add('active');

        renderCurrentView();
    }

    function navigateToStep(stepId, themeId = null, topicId = null) {
        state.currentStepId = stepId;
        if(themeId) state.selectedThemeId = themeId;
        if(topicId) state.selectedTopicId = topicId;

        if(stepId === 'themes-list-view') {
            state.selectedThemeId = null;
            state.selectedTopicId = null;
        }
        if(stepId === 'questions-list-view') {
            state.selectedTopicId = null;
        }

        renderCurrentView();
    }

    function renderCurrentView() {
        switch (state.currentViewId) {
            case 'stappenplan-view':
                renderStappenplanView();
                break;
            case 'chat-view':
                renderChatView();
                break;
            case 'summary-view':
                renderSummaryView();
                break;
        }
        updateUiForCurrentState();
        updateProgressBar();
    }

    function updateUiForCurrentState() {
        const shouldShowInput = (state.currentViewId === 'chat-view') || (state.currentStepId === 'answer-options-view');
        if (shouldShowInput) {
            const parent = (state.currentViewId === 'chat-view')
                ? document.getElementById('chat-view')
                : document.getElementById('chat-context-panel');

            if (parent) {
                parent.appendChild(inputArea);
                inputArea.style.display = 'flex';
            }
        } else {
            inputArea.style.display = 'none';
        }
    }

    // --- VIEW-SPECIFIC RENDER FUNCTIONS ---
    function renderStappenplanView() {
        const stappenplanContainer = document.getElementById('stappenplan-view');
        stappenplanContainer.querySelectorAll('.step-view').forEach(step => {
            step.style.display = 'none'; // Use display none to hide
        });

        const activeStepContainer = document.getElementById(state.currentStepId);
        if (activeStepContainer) {
            activeStepContainer.style.display = 'block'; // Use display block to show
        }

        switch (state.currentStepId) {
            case 'themes-list-view':
                renderThemesList();
                break;
            case 'questions-list-view':
                renderQuestionsList();
                break;
            case 'answer-options-view':
                renderAnswerOptions();
                break;
        }
    }

    function renderChatView() {
        const container = document.getElementById('chat-view');
        container.innerHTML = '';
        const chatbox = document.createElement('div');
        chatbox.id = 'full-chatbox';
        chatbox.style.flex = '1';
        chatbox.style.overflowY = 'auto';
        container.appendChild(chatbox);

        state.history.forEach(msg => {
            if (msg.role !== 'system') {
                addChatMessage(msg.role, msg.content, 'full-chatbox');
            }
        });
    }

    function renderSummaryView() {
        const container = document.getElementById('summary-view');
        // FIX: Gebruik een streepje (-) in plaats van een underscore (_)
        const template = document.getElementById('summary-template');
        if (template) {
            container.innerHTML = template.innerHTML;
        }

        const listContainer = document.getElementById('summary-list-container');
        if (!listContainer) return;
        listContainer.innerHTML = '';
        let hasAnswers = false;

        state.plan.forEach(theme => {
            const answeredTopics = theme.topics.filter(t => t.answer && t.answer !== '__SKIPPED__');
            if (answeredTopics.length > 0) {
                hasAnswers = true;
                const group = document.createElement('div');
                group.className = 'summary-group';
                group.innerHTML = `<h3 class="summary-theme-title">${theme.name}</h3>`;

                answeredTopics.forEach(topic => {
                    const item = document.createElement('div');
                    item.className = 'summary-item';
                    item.innerHTML = `
                        <div class="summary-item-content">
                            <strong>${topic.question}</strong>
                            <span>${topic.answer}</span>
                        </div>
                        <i class="edit-icon fa-solid fa-pencil"></i>`;
                    item.querySelector('.edit-icon').onclick = () => {
                        navigateToView('stappenplan-view');
                        navigateToStep('answer-options-view', theme.id, topic.id);
                    };
                    group.appendChild(item);
                });
                listContainer.appendChild(group);
            }
        });
        if (!hasAnswers) {
            listContainer.innerHTML = '<p>Je hebt nog geen antwoorden gegeven.</p>';
        }
    }

    // --- STEP-SPECIFIC RENDER FUNCTIONS ---
    function renderThemesList() {
        const container = document.getElementById('themes-list-view');
        if (!container) return;
        container.innerHTML = '';
        state.plan.forEach(theme => {
            const isCompleted = theme.topics.every(t => t.answer);
            const card = document.createElement('div');
            card.className = 'theme-card';
            card.innerHTML = `
                <div class="theme-card-content">
                    <p>Thema</p>
                    <h3>${theme.name}</h3>
                </div>
                <i class="status-icon fa-solid ${isCompleted ? 'fa-circle-check completed' : 'fa-circle-notch'}"></i>`;
            card.onclick = () => navigateToStep('questions-list-view', theme.id);
            container.appendChild(card);
        });
    }

    function renderQuestionsList() {
        const container = document.getElementById('questions-list-view');
        if (!container) return;
        // FIX: Gebruik een streepje (-) in plaats van een underscore (_)
        const template = document.getElementById('questions-list-template');
        if (template) {
            container.innerHTML = template.innerHTML;
        }

        const theme = state.plan.find(t => t.id === state.selectedThemeId);
        if(!theme) return;

        document.getElementById('back-to-themes').onclick = () => navigateToStep('themes-list-view');
        document.getElementById('questions-theme-title').textContent = theme.name;
        const listContainer = document.getElementById('questions-list-container');
        if (!listContainer) return;
        listContainer.innerHTML = '';

        theme.topics.forEach(topic => {
            const card = document.createElement('div');
            card.className = 'question-card';
            card.textContent = topic.question;
            if (topic.answer === '__SKIPPED__') card.classList.add('skipped');
            else if (topic.answer) card.classList.add('answered');
            card.onclick = () => selectQuestion(topic.id);
            listContainer.appendChild(card);
        });
    }

    function renderAnswerOptions() {
        const container = document.getElementById('answer-options-view');
        if (!container) return;
        // FIX: Gebruik een streepje (-) in plaats van een underscore (_)
        const template = document.getElementById('answer-options-template');
        if(template) {
            container.innerHTML = template.innerHTML;
            // Zorg dat de split-screen view de flex-eigenschap behoudt.
            container.style.display = 'flex';
            container.style.flexDirection = 'column';
        }

        const theme = state.plan.find(t => t.id === state.selectedThemeId);
        const topic = theme.topics.find(t => t.id === state.selectedTopicId);
        if (!topic) return;

        document.getElementById('answer-breadcrumb').innerHTML = `<span onclick="navigateToStep('themes-list-view')">Thema's</span> > <span onclick="navigateToStep('questions-list-view', '${theme.id}')">${theme.name}</span>`;
        document.getElementById('answer-question-title').textContent = topic.question;
        const buttonContainer = document.getElementById('answer-buttons-container');
        if(!buttonContainer) return;
        buttonContainer.innerHTML = '';

        topic.predefined_answers.forEach(answer => {
            const btn = document.createElement('button');
            btn.className = 'answer-btn';
            btn.textContent = answer.text;
            if (answer.isCustom) {
                btn.classList.add('anders');
                btn.onclick = () => {
                    input.placeholder = `Jouw antwoord op: "${topic.question.substring(0,30)}..."`;
                    input.focus();
                };
            } else {
                btn.onclick = () => handleSaveAnswer(topic.id, answer.text);
            }
            buttonContainer.appendChild(btn);
        });

        document.getElementById('more-info-btn').onclick = () => handleGuidedDialogue();
        document.getElementById('skip-question-btn').onclick = () => handleSaveAnswer(topic.id, '__SKIPPED__');
    }

    // --- API & CHAT HANDLING ---

    async function callApi(command, data = {}) {
        try {
            const res = await fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ command, data })
            });
            if (!res.ok) throw new Error(`Server error: ${res.status}`);
            return res.json();
        } catch (error) {
            console.error("API Call failed:", error);
            addChatMessage('bot', 'Oeps, de verbinding met de server is mislukt. Probeer het later opnieuw.', 'full-chatbox');
            return null;
        }
    }

    async function streamBotResponse(command, data = {}, targetChatboxId) {
        setUiLock(true);
        const loadingBubble = showLoadingIndicator(targetChatboxId);
        let fullResponse = "";

        try {
            const response = await fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ command, data })
            });
            if (!response.ok) throw new Error(`Server error: ${response.status}`);

            clearTimeout(loadingBubble.timeoutId);
            loadingBubble.element.innerHTML = "";

            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            while (true) {
                const { value, done } = await reader.read();
                if (done) break;

                const chunk = decoder.decode(value, { stream: true });
                const jsonStrings = chunk.match(/data: \{[\s\S]*?\}(?=\n\n|$)/g);

                if (jsonStrings) {
                    for (const jsonString of jsonStrings) {
                        try {
                            const parsed = JSON.parse(jsonString.substring(5));
                            if (parsed.content) {
                                fullResponse += parsed.content;
                                loadingBubble.element.innerHTML = marked.parse(fullResponse);
                                scrollChatToBottom(targetChatboxId);
                            } else if (parsed.error) {
                                fullResponse = parsed.error;
                                loadingBubble.element.innerHTML = fullResponse;
                                break;
                            }
                        } catch (e) {
                            console.error("Failed to parse stream chunk:", jsonString, e);
                        }
                    }
                }
            }
        } catch (error) {
            console.error("Streaming failed:", error);
            clearTimeout(loadingBubble.timeoutId);
            loadingBubble.element.textContent = "Sorry, er ging iets mis tijdens het ophalen van het antwoord.";
        } finally {
            if (fullResponse) {
                state.history.push({ role: "assistant", content: fullResponse });
            }
            if(!fullResponse && loadingBubble.element) {
                loadingBubble.element.remove();
            }
            setUiLock(false);
        }
    }

    function showLoadingIndicator(targetChatboxId) {
        const container = document.getElementById(targetChatboxId);
        if(!container) return { element: null, timeoutId: null};
        const bubble = document.createElement('div');
        bubble.className = 'bubble bot-bubble';
        bubble.textContent = 'Mae is aan het nadenken...';
        container.appendChild(bubble);
        scrollChatToBottom(targetChatboxId);

        const timeoutId = setTimeout(() => {
            if(bubble) bubble.textContent = 'Het kost iets meer tijd, maar Mae is bezig voor jou.';
        }, 3000);

        return { element: bubble, timeoutId: timeoutId };
    }

    function addChatMessage(role, text, containerId) {
        const container = document.getElementById(containerId);
        if (!container) return;
        const div = document.createElement('div');
        div.className = `bubble ${role}-bubble`;
        div.innerHTML = marked.parse(text);
        container.appendChild(div);
        scrollChatToBottom(containerId);
    }

    function scrollChatToBottom(containerId) {
        const container = document.getElementById(containerId);
        if (container) container.scrollTop = container.scrollHeight;
    }

    // --- ACTION HANDLERS ---

    async function selectQuestion(topicId) {
        setUiLock(true);
        // Eerst navigeren om de DOM-structuur op te bouwen
        navigateToStep('answer-options-view', state.selectedThemeId, topicId);
        // Dan de API call doen en de chat vullen
        const data = await callApi('question_selected', { topic_id: topicId });
        if (data && data.explanation) {
            addChatMessage('bot', data.explanation, 'answer-chat-context');
            state.history.push({role:'system', content: data.explanation });
        }
        setUiLock(false);
    }

    async function handleSend() {
        const message = input.value.trim();
        if (!message || state.isLocked) return;
        const targetChatboxId = (state.currentStepId === 'answer-options-view') ? 'answer-chat-context' : 'full-chatbox';

        input.value = '';
        input.style.height = 'auto';

        addChatMessage('user', message, targetChatboxId);
        state.history.push({ role: 'user', content: message });

        if (state.pendingAnswer) {
            const payload = { topic_id: state.selectedTopicId, original_answer: state.pendingAnswer, clarification: message };
            const response = await callApi('submit_clarification', payload);
            handleApiResponse(response);
        } else if (state.currentStepId === 'answer-options-view') {
            await handleSaveAnswer(state.selectedTopicId, message);
        } else {
            await streamBotResponse('user_message', { message: message }, targetChatboxId);
        }
    }

    async function handleSaveAnswer(topicId, answer) {
        setUiLock(true);
        const response = await callApi('save_answer', { topic_id: topicId, answer });
        handleApiResponse(response);
        setUiLock(false);
    }

    async function handleGuidedDialogue() {
        const message = 'Kun je meer informatie geven over deze vraag?';
        const targetChatboxId = 'answer-chat-context';
        addChatMessage('user', message, targetChatboxId);
        state.history.push({ role: 'user', content: message });
        await streamBotResponse('start_guided_dialogue', { topic_id: state.selectedTopicId }, targetChatboxId);
    }

    function handleApiResponse(data) {
        if (!data) return;

        state.plan = data.state.plan;
        state.history = data.state.history;
        state.pendingAnswer = null;
        input.classList.remove('validation-failed');
        input.placeholder = 'Typ een bericht...';

        if (data.status === 'ok') {
            if (data.final_message) {
                 addChatMessage('bot', data.final_message, 'full-chatbox');
                 navigateToView('summary-view');
            } else {
                 navigateToStep('questions-list-view', state.selectedThemeId);
            }
        } else if (data.status === 'validation_failed') {
            state.pendingAnswer = data.original_answer;
            input.placeholder = "Kun je dit verduidelijken?";
            input.classList.add('validation-failed');
            renderCurrentView();
            input.focus();
        } else {
            renderCurrentView();
        }
    }

    function updateProgressBar() {
        if(!state.plan || state.plan.length === 0) return;
        const total = state.plan.reduce((acc, theme) => acc + theme.topics.length, 0);
        if (total === 0) return;
        const answered = state.plan.reduce((acc, theme) => acc + theme.topics.filter(t => t.answer).length, 0);
        if(progressBar) progressBar.style.width = `${(answered / total) * 100}%`;
    }

    // --- GLOBAL EVENT LISTENERS & START ---
    document.querySelectorAll('.tab-item').forEach(tab => {
        tab.addEventListener('click', () => navigateToView(tab.dataset.view));
    });

    window.navigateToStep = navigateToStep;

    initialize();
});
</script>

</body>
</html>
