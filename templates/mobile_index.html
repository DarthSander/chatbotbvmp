<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>Geboorteplan Assistent</title>

    <!-- Icons & CSS -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet"
          href="{{ url_for('static', filename='mobile_style.css') }}">

    <!-- Markdown parser -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
<div id="mobile-layout">
    <main id="main-content">
        <!-- Stappenplan -->
        <div id="stappenplan-view" class="view active">
            <div id="progress-bar-container"><div id="progress-bar"></div></div>

            <div id="themes-list-view"     class="step-view active"></div>
            <div id="questions-list-view"  class="step-view"></div>
            <div id="answer-options-view"  class="step-view split-screen"></div>
        </div>

        <!-- Chat -->
        <div id="chat-view" class="view"><div id="full-chatbox"></div></div>

        <!-- Samenvatting -->
        <div id="summary-view" class="view"></div>
    </main>

    <!-- Sticky input; wordt dynamisch verplaatst -->
    <div id="mobile-input-area" style="display:none;">
        <textarea id="mobile-input" placeholder="Typ een bericht…" rows="1"></textarea>
        <button id="mobile-send-btn" disabled>
            <i class="fa-solid fa-paper-plane"></i>
        </button>
    </div>

    <!-- Onderste tab-bar -->
    <nav id="tab-bar">
        <div class="tab-item active" data-view="stappenplan-view">
            <i class="fa-solid fa-list-check"></i><span>Stappenplan</span>
        </div>
        <div class="tab-item" data-view="chat-view">
            <i class="fa-solid fa-comments"></i><span>Chat</span>
        </div>
        <div class="tab-item" data-view="summary-view">
            <i class="fa-solid fa-clipboard-check"></i><span>Antwoorden</span>
        </div>
    </nav>
</div>

<!-- ------- INLINE TEMPLATES ------- -->
<template id="themes-list-template"></template>

<template id="questions-list-template">
    <div class="page-header" id="back-to-themes">
        <i class="fa-solid fa-arrow-left"></i><h2 id="questions-theme-title"></h2>
    </div>
    <div id="questions-list-container"></div>
</template>

<template id="answer-options-template">
    <div id="options-panel">
        <div id="answer-breadcrumb"></div>
        <h3 class="question-title-header" id="answer-question-title"></h3>
        <div id="answer-buttons-container"></div>

        <div class="answer-actions">
            <div class="action-button" id="more-info-btn">
                <i class="fa-solid fa-circle-question"></i> Meer informatie
            </div>
            <div class="action-button" id="skip-question-btn">
                <i class="fa-solid fa-forward"></i> Sla vraag over
            </div>
        </div>
    </div>

    <div id="chat-context-panel">
        <div class="chatbox-context" id="answer-chat-context"></div>
    </div>
</template>

<template id="summary-template">
    <h2>Mijn Antwoorden</h2>
    <div id="summary-list-container"></div>
</template>
<!-- ------- EINDE   TEMPLATES ------- -->

<script>
document.addEventListener('DOMContentLoaded', () => {
    /* ---------- STATE ---------- */
    let state = {
        plan: [],
        history: [],
        currentViewId:  'stappenplan-view',
        currentStepId:  'themes-list-view',
        selectedThemeId: null,
        selectedTopicId: null,
        isLocked: false,
        pendingAnswer: null
    };

    /* ---------- ELEMENTEN ---------- */
    const API_URL    = "/agent";
    const inputArea  = document.getElementById('mobile-input-area');
    const input      = document.getElementById('mobile-input');
    const sendBtn    = document.getElementById('mobile-send-btn');
    const progress   = document.getElementById('progress-bar');

    /* ---------- HELPER ---------- */
    const setUiLock = locked => {
        state.isLocked = locked;
        input.disabled = locked;
        sendBtn.disabled = locked || !input.value.trim();
    };

    /* ---------- INIT ---------- */
    (async function initialize() {
        setUiLock(true);
        const init = await callApi('initialize');
        if (init) {
            state.plan    = init.state.plan;
            state.history = init.state.history || [];
            if (init.welcome_message) {
                addChat('bot', init.welcome_message, 'full-chatbox');
            }
            renderCurrentView();
        }
        setUiLock(false);
    })();

    /* ---------- INPUT ---------- */
    input.addEventListener('input', () => {
        sendBtn.disabled = state.isLocked || !input.value.trim();
        input.style.height = 'auto';
        input.style.height = input.scrollHeight + 'px';
    });
    input.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); }
    });
    sendBtn.addEventListener('click', handleSend);

    /* ---------- NAVIGATIE ---------- */
    document.querySelectorAll('.tab-item').forEach(tab =>
        tab.addEventListener('click', () => navigateView(tab.dataset.view))
    );

    function navigateView(view) {
        if (view === state.currentViewId && view !== 'stappenplan-view') return;
        state.currentViewId = view;

        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById(view).classList.add('active');

        document.querySelector('.tab-item.active').classList.remove('active');
        document.querySelector(`.tab-item[data-view="${view}"]`).classList.add('active');

        renderCurrentView();
    }

    function navigateStep(step, themeId = null, topicId = null) {
        state.currentStepId = step;
        if (themeId)  state.selectedThemeId  = themeId;
        if (topicId)  state.selectedTopicId  = topicId;

        if (step === 'themes-list-view')   { state.selectedThemeId = state.selectedTopicId = null; }
        if (step === 'questions-list-view'){ state.selectedTopicId = null; }

        renderCurrentView();
    }
    window.navigateToStep = navigateStep; // nodig voor inline onclicks

    /* ---------- RENDER ---------- */
    function renderCurrentView() {
        switch (state.currentViewId) {
            case 'stappenplan-view': renderStappenplan(); break;
            case 'chat-view':        renderChat();        break;
            case 'summary-view':     renderSummary();     break;
        }
        updateInputPosition();
        updateProgress();
    }

    function updateInputPosition() {
        const needsInput = state.currentViewId === 'chat-view'
                        || state.currentStepId === 'answer-options-view';
        if (needsInput) {
            const parent = state.currentViewId === 'chat-view'
                         ? document.getElementById('chat-view')
                         : document.getElementById('chat-context-panel');
            parent.appendChild(inputArea);
            inputArea.style.display = 'flex';
        } else {
            inputArea.style.display = 'none';
        }
    }

    function updateProgress() {
        if (!state.plan.length) return;
        const total    = state.plan.reduce((n,t) => n + t.topics.length, 0);
        const answered = state.plan.reduce((n,t) => n + t.topics.filter(tp=>tp.answer).length, 0);
        progress.style.width = (answered / total * 100) + '%';
    }

    /* ---------- STAPPENPLAN-RENDERS ---------- */
    function renderStappenplan() {
        const view = document.getElementById('stappenplan-view');
        view.querySelectorAll('.step-view').forEach(s => s.style.display = 'none');
        const active = document.getElementById(state.currentStepId);
        if (active) active.style.display = 'block';

        if (state.currentStepId === 'themes-list-view')   return renderThemes();
        if (state.currentStepId === 'questions-list-view')return renderQuestions();
        if (state.currentStepId === 'answer-options-view')return renderAnswers();
    }

    function renderThemes() {
        const c = document.getElementById('themes-list-view'); c.innerHTML = '';
        state.plan.forEach(th => {
            const done = th.topics.every(t=>t.answer);
            c.insertAdjacentHTML('beforeend', `
              <div class="theme-card" onclick="navigateToStep('questions-list-view','${th.id}')">
                  <div class="theme-card-content">
                      <p>Thema</p><h3>${th.name}</h3>
                  </div>
                  <i class="status-icon fa-solid ${done?'fa-circle-check completed':'fa-circle-notch'}"></i>
              </div>`);
        });
    }

    function renderQuestions() {
        const tpl = document.getElementById('questions-list-template').innerHTML;
        const view = document.getElementById('questions-list-view');
        view.innerHTML = tpl;

        const th = state.plan.find(t=>t.id===state.selectedThemeId); if (!th) return;
        document.getElementById('back-to-themes').onclick = () => navigateStep('themes-list-view');
        document.getElementById('questions-theme-title').textContent = th.name;

        const list = document.getElementById('questions-list-container');
        th.topics.forEach(tp => {
            const cls = tp.answer==='__SKIPPED__' ? 'skipped'
                     : tp.answer ? 'answered' : '';
            list.insertAdjacentHTML('beforeend', `
              <div class="question-card ${cls}" onclick="selectQuestion('${tp.id}')">
                  ${tp.question}
              </div>`);
        });
    }

    function renderAnswers() {
        const tpl = document.getElementById('answer-options-template').innerHTML;
        const view = document.getElementById('answer-options-view');
        view.innerHTML = tpl;

        const th = state.plan.find(t=>t.id===state.selectedThemeId);
        const tp = th.topics.find(t=>t.id===state.selectedTopicId);
        document.getElementById('answer-breadcrumb').innerHTML =
            `<span onclick="navigateToStep('themes-list-view')">Thema's</span>
             > <span onclick="navigateToStep('questions-list-view','${th.id}')">${th.name}</span>`;
        document.getElementById('answer-question-title').textContent = tp.question;

        const btns = document.getElementById('answer-buttons-container');
        btns.innerHTML = '';
        tp.predefined_answers.forEach(ans=>{
            const b = document.createElement('button');
            b.className = 'answer-btn' + (ans.isCustom?' anders':'');
            b.textContent = ans.text;
            if (ans.isCustom) {
                b.onclick = ()=>{ input.placeholder=`Jouw antwoord op "${tp.question.slice(0,30)}…"`;
                                  input.focus(); };
            } else {
                b.onclick = ()=>handleSaveAnswer(tp.id,ans.text);
            }
            btns.appendChild(b);
        });
        document.getElementById('more-info-btn').onclick = handleGuidedDialogue;
        document.getElementById('skip-question-btn').onclick = ()=>handleSaveAnswer(tp.id,'__SKIPPED__');
    }

    function renderChat() {
        const c = document.getElementById('chat-view');
        c.innerHTML = '<div id="full-chatbox" style="flex:1;overflow-y:auto;"></div>';
        state.history.filter(m=>m.role!=='system').forEach(m=>addChat(m.role,m.content,'full-chatbox'));
    }

    function renderSummary() {
        const tpl = document.getElementById('summary-template').innerHTML;
        const view = document.getElementById('summary-view'); view.innerHTML = tpl;

        const list = document.getElementById('summary-list-container'); list.innerHTML='';
        state.plan.forEach(th=>{
            const answered = th.topics.filter(t=>t.answer && t.answer!=='__SKIPPED__');
            if(!answered.length) return;
            list.insertAdjacentHTML('beforeend',`<h3 class="summary-theme-title">${th.name}</h3>`);
            answered.forEach(tp=>{
                list.insertAdjacentHTML('beforeend',`
                  <div class="summary-item">
                      <div class="summary-item-content">
                          <strong>${tp.question}</strong><span>${tp.answer}</span>
                      </div>
                      <i class="edit-icon fa-solid fa-pencil"
                         onclick="navigateToView('stappenplan-view');navigateToStep('answer-options-view','${th.id}','${tp.id}')">
                      </i>
                  </div>`);
            });
        });
        if(!list.children.length) list.innerHTML='<p>Je hebt nog geen antwoorden gegeven.</p>';
    }

    /* ---------- CHAT & API ---------- */
    async function callApi(command,data={}) {
        try {
            const r = await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json'},
                                           body:JSON.stringify({command,data})});
            if(!r.ok) throw new Error('Server '+r.status);
            return await r.json();
        } catch(e){
            console.error(e);
            addChat('bot','Oeps, verbinding mislukt.','full-chatbox');
            return null;
        }
    }

    async function streamBot(command,data={},boxId){
        setUiLock(true);
        const loader = showLoader(boxId);
        let full='';

        try{
            const resp = await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json'},
                                              body:JSON.stringify({command,data})});
            if(!resp.ok) throw new Error('Server '+resp.status);

            clearTimeout(loader.timeout);
            loader.el.innerHTML='';

            const rd = resp.body.getReader(), dec=new TextDecoder();
            while(true){
                const {value,done}=await rd.read(); if(done)break;
                const chunk = dec.decode(value,{stream:true});
                const parts = chunk.match(/data: \{[\s\S]*?}/g)||[];
                parts.forEach(p=>{
                    try{
                        const j=JSON.parse(p.slice(6));
                        if(j.content){ full+=j.content; loader.el.innerHTML = marked.parse(full); scroll(boxId); }
                        else if(j.error){ full=j.error; loader.el.textContent=full; }
                    }catch(e){console.error('parse',e);}
                });
            }
        }catch(e){
            console.error(e); loader.el.textContent='Sorry, er ging iets mis.';
        }finally{
            if(full) state.history.push({role:'assistant',content:full});
            setUiLock(false);
        }
    }

    /* ----- ACTIONS ----- */
    async function selectQuestion(topicId){
        setUiLock(true);
        navigateStep('answer-options-view',state.selectedThemeId,topicId);
        /* Pixel-9 fix – DOM klaar maken vóór API-call */
        await new Promise(res=>setTimeout(res,50));
        const data = await callApi('question_selected',{topic_id:topicId});
        if(data?.explanation){
            addChat('bot',data.explanation,'answer-chat-context');
            state.history.push({role:'system',content:data.explanation});
        }
        setUiLock(false);
    }

    async function handleSaveAnswer(topicId,answer){
        setUiLock(true);
        const resp = await callApi('save_answer',{topic_id:topicId,answer});
        processResponse(resp);
        setUiLock(false);
    }

    async function handleSend(){
        if(state.isLocked) return;
        const msg = input.value.trim(); if(!msg) return;
        const box = state.currentStepId==='answer-options-view'?'answer-chat-context':'full-chatbox';

        input.value=''; input.style.height='auto';
        addChat('user',msg,box); state.history.push({role:'user',content:msg});

        if(state.pendingAnswer){
            const resp = await callApi('submit_clarification',{
                topic_id:state.selectedTopicId,
                original_answer:state.pendingAnswer,
                clarification:msg
            });
            processResponse(resp);
        }else if(state.currentStepId==='answer-options-view'){
            await handleSaveAnswer(state.selectedTopicId,msg);
        }else{
            await streamBot('user_message',{message:msg},box);
        }
    }

    async function handleGuidedDialogue(){
        const m = 'Kun je meer informatie geven over deze vraag?';
        addChat('user',m,'answer-chat-context');
        state.history.push({role:'user',content:m});
        await streamBot('start_guided_dialogue',{topic_id:state.selectedTopicId},'answer-chat-context');
    }

    function processResponse(data){
        if(!data) return;

        /* nieuwe betaal-flow */
        if(data.status==='payment_required'){
            alert('De gratis 5 minuten zijn verstreken. Je moet nu betalen om verder te gaan.');
            location.href='{{ url_for("start_payment") }}';
            return;
        }

        state.plan    = data.state.plan;
        state.history = data.state.history;
        state.pendingAnswer = null;
        input.classList.remove('validation-failed');
        input.placeholder = 'Typ een bericht…';

        if(data.status==='ok'){
            if(data.final_message){
                addChat('bot',data.final_message,'full-chatbox');
                navigateView('summary-view');
            } else {
                navigateStep('questions-list-view',state.selectedThemeId);
            }
        }
        else if(data.status==='validation_failed'){
            state.pendingAnswer = data.original_answer;
            input.placeholder = 'Kun je dit verduidelijken?';
            input.classList.add('validation-failed');
            renderCurrentView();
            input.focus();
        }
    }

    /* ---------- UTIL ---------- */
    function addChat(role,text,boxId){
        const box = document.getElementById(boxId);
        if(!box) return;
        const div = document.createElement('div');
        div.className = `bubble ${role}-bubble`;
        div.innerHTML = marked.parse(text);
        box.appendChild(div); scroll(boxId);
    }
    function showLoader(boxId){
        const box = document.getElementById(boxId);
        const b   = document.createElement('div');
        b.className='bubble bot-bubble';
        b.textContent='Mae is aan het nadenken…';
        box.appendChild(b); scroll(boxId);
        const t = setTimeout(()=>{b.textContent='Het duurt wat langer, Mae werkt eraan…';},3000);
        return {el:b,timeout:t};
    }
    function scroll(boxId){ const c=document.getElementById(boxId); c&& (c.scrollTop=c.scrollHeight); }

});
</script>
</body>
</html>
