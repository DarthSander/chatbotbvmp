<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Kies Template – Geboorteplan Assistent</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    /* --- Carousel Styles --- */
    .carousel-viewport {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 40px 0;
      perspective: 1000px;
    }

    .carousel-container {
      position: relative;
      width: 340px; /* Aangepast formaat */
      height: 360px; /* Aangepast formaat */
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.77, 0, 0.175, 1);
    }

    .template-card {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--white);
      border-radius: 16px;
      overflow: hidden;
      text-decoration: none;
      color: var(--text);
      box-shadow: var(--shadow-soft);
      border: 1px solid rgba(0,0,0,0.05);
      cursor: pointer;
      transition: transform 0.6s cubic-bezier(0.77, 0, 0.175, 1),
                  opacity 0.6s cubic-bezier(0.77, 0, 0.175, 1);
    }

    .template-card img {
      width: 100%;
      height: auto;
      display: block;
      aspect-ratio: 16 / 14;
      object-fit: cover;
      border-bottom: 1px solid var(--rose-subtle);
      pointer-events: none;
    }

    .template-card-content {
      padding: 16px;
      pointer-events: none;
    }

    .template-card-content h4 {
      margin: 0 0 8px 0;
      color: var(--rose-dark);
    }

    /* --- MOBIELE OPTIMALISATIE --- */
    @media (max-width: 768px) {
      .carousel-viewport {
        margin: 20px 0;
      }
      .carousel-container {
        width: 240px; /* Aangepast formaat voor mobiel */
        height: 280px; /* Aangepast formaat voor mobiel */
      }
      /* Aanpassen van de header op mobiel */
      .dashboard-header {
          flex-direction: column;
          align-items: flex-start;
          gap: 15px;
      }
    }
  </style>
</head>
<body>
<main id="layout">
  <div class="container dashboard-container">
    <div class="dashboard-header">
      <h1>Kies een visueel template</h1>
      <a href="{{ url_for('dashboard') }}" class="submit-btn">Terug naar Dashboard</a>
    </div>
    <p>Selecteer een template hieronder. Scroll of swipe om door de opties te navigeren.</p>

    <div class="carousel-viewport">
      <div class="carousel-container">
        {% for template in templates %}
          <a href="{{ url_for('visual_plan', template_id=template.id) }}"
             class="template-card"
             data-index="{{ loop.index0 }}">
            <img src="{{ url_for('static', filename=template.thumbnail_filename) }}" alt="Thumbnail van {{ template.name }}">
            <div class="template-card-content">
              <h4>{{ template.name }}</h4>
            </div>
          </a>
        {% else %}
          <p>Er zijn momenteel geen templates beschikbaar.</p>
        {% endfor %}
      </div>
    </div>

  </div>
</main>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const container = document.querySelector('.carousel-container');
  const items = Array.from(document.querySelectorAll('.template-card'));
  if (items.length === 0) return;

  let currentIndex = 0;
  const isMobile = window.innerWidth <= 768;

  function updateCarousel() {
    items.forEach((item, i) => {
      const offset = i - currentIndex;
      let newTransform, newOpacity;

      if (offset === 0) {
        newTransform = 'rotateY(0deg) translateX(0px) translateZ(0px) scale(1)';
        newOpacity = 1;
        item.style.cursor = 'pointer';
        item.dataset.active = 'true';
      } else {
        const sign = Math.sign(offset);
        // Aangepaste waarden voor kleinere container
        const xTranslate = isMobile ? 70 * offset : 120 * offset;
        const zTranslate = isMobile ? -100 : -200;
        const yRotate = -45 * sign;
        const scale = isMobile ? 0.7 : 0.75;

        newTransform = `rotateY(${yRotate}deg) translateX(${xTranslate}px) translateZ(${zTranslate}px) scale(${scale})`;
        newOpacity = 0.6;
        item.style.cursor = 'pointer';
        item.dataset.active = 'false';
      }
      item.style.transform = newTransform;
      item.style.opacity = newOpacity;
      item.style.zIndex = items.length - Math.abs(offset);
    });
  }

  function moveToIndex(index) {
    currentIndex = Math.max(0, Math.min(index, items.length - 1));
    updateCarousel();
  }

  container.addEventListener('click', (e) => {
    const clickedItem = e.target.closest('.template-card');
    if (!clickedItem) return;

    const isActive = clickedItem.dataset.active === 'true';
    if (!isActive) {
      e.preventDefault();
      moveToIndex(parseInt(clickedItem.dataset.index));
    }
  });

  container.addEventListener('wheel', (e) => {
    e.preventDefault();
    const direction = Math.sign(e.deltaY);
    if (direction > 0 && currentIndex < items.length - 1) {
      moveToIndex(currentIndex + 1);
    } else if (direction < 0 && currentIndex > 0) {
      moveToIndex(currentIndex - 1);
    }
  }, { passive: false });

  let isDragging = false;
  let startX = 0;
  let currentTranslate = 0;

  function dragStart(e) {
    isDragging = true;
    startX = e.pageX || e.touches[0].pageX;
    container.style.transition = 'none';
  }

  function dragMove(e) {
    if (!isDragging) return;
    const x = e.pageX || e.touches[0].pageX;
    currentTranslate = x - startX;
  }

  function dragEnd() {
    if (!isDragging) return;
    isDragging = false;
    container.style.transition = 'transform 0.6s cubic-bezier(0.77, 0, 0.175, 1)';

    if (currentTranslate < -50 && currentIndex < items.length - 1) {
      moveToIndex(currentIndex + 1);
    } else if (currentTranslate > 50 && currentIndex > 0) {
      moveToIndex(currentIndex - 1);
    }
    currentTranslate = 0;
  }

  container.addEventListener('mousedown', dragStart);
  container.addEventListener('mousemove', dragMove);
  container.addEventListener('mouseup', dragEnd);
  container.addEventListener('mouseleave', dragEnd);

  container.addEventListener('touchstart', dragStart);
  container.addEventListener('touchmove', dragMove);
  container.addEventListener('touchend', dragEnd);

  updateCarousel();
});
</script>

</body>
</html>
